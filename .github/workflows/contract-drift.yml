name: Contract Drift Check

on:
  repository_dispatch:
    types: [api-contract-changed]
  schedule:
    # Weekly, Monday 09:00 UTC — catches drift even if a dispatch is ever missed.
    - cron: "0 9 * * 1"

permissions:
  issues: write
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e .[dev]

      - name: Fetch latest platform contract
        run: |
          curl -sSL -o /tmp/latest-contract.json \
            https://raw.githubusercontent.com/AlphaWaveSystems/awsys-shortener/master/contracts/sdk-contract.json

      - name: Compare version and diff
        id: diff
        run: |
          VENDORED_VERSION=$(python3 -c "import json; print(json.load(open('tests/contracts/sdk-contract.json'))['version'])")
          LATEST_VERSION=$(python3 -c "import json; print(json.load(open('/tmp/latest-contract.json'))['version'])")
          echo "vendored_version=$VENDORED_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VENDORED_VERSION" != "$LATEST_VERSION" ]; then
            echo "version_mismatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_mismatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run contract-fixture suite against the fetched contract
        id: contract_test
        continue-on-error: true
        run: |
          cp /tmp/latest-contract.json /tmp/sdk-contract-under-test.json
          cp tests/contracts/sdk-contract.json /tmp/vendored-backup.json
          cp /tmp/latest-contract.json tests/contracts/sdk-contract.json
          pytest -q tests/test_contract.py
          TEST_EXIT=$?
          cp /tmp/vendored-backup.json tests/contracts/sdk-contract.json
          exit $TEST_EXIT

      - name: Report drift as a GitHub issue
        if: steps.diff.outputs.version_mismatch == 'true' || steps.contract_test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ steps.diff.outputs.latest_version }}
          VENDORED_VERSION: ${{ steps.diff.outputs.vendored_version }}
          TEST_OUTCOME: ${{ steps.contract_test.outcome }}
          # client_payload is attacker-controllable on a public repository_dispatch
          # trigger — only ever written into the issue body as inert, quoted text
          # via this env var, never interpolated into a shell command.
          DISPATCH_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          gh label create sdk-parity --color 5319E7 --description "Cross-SDK contract parity drift" 2>/dev/null || true

          TITLE="contract drift: sdk-contract $LATEST_VERSION"
          EXISTING=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq '.[0].number' || true)

          BODY_FILE=$(mktemp)
          {
            echo "Vendored contract version: \`$VENDORED_VERSION\`"
            echo "Latest platform contract version: \`$LATEST_VERSION\`"
            echo "Contract-fixture suite against the latest contract: \`$TEST_OUTCOME\`"
            echo "Triggered by: \`${DISPATCH_SOURCE:-scheduled check}\`"
            echo ""
            echo "Re-vendor with: \`cp <platform repo>/contracts/sdk-contract.json tests/contracts/sdk-contract.json\`, then \`pytest tests/test_contract.py\` and fix any failures."
          } > "$BODY_FILE"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --label sdk-parity --body-file "$BODY_FILE"
          fi

  nightly-staging:
    name: Nightly staging integration suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: pip install -e .[dev]
      - name: pytest (integration, requires AWSYS_API_KEY)
        env:
          AWSYS_API_KEY: ${{ secrets.AWSYS_API_KEY }}
          AWSYS_BASE_URL: ${{ vars.AWSYS_BASE_URL || 'https://staging.awsys.co' }}
        run: |
          if [ -z "$AWSYS_API_KEY" ]; then
            echo "AWSYS_API_KEY secret not set — skipping. Note: this key rots whenever"
            echo "the staging test user is deleted; see docs/STAGING-TEST-ACCOUNTS.md in"
            echo "the awsys-shortener repo for how to provision a fresh one."
            exit 0
          fi
          pytest -q -m integration
