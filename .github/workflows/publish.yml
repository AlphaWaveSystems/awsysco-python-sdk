name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Unit + contract tests (gate before publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package with dev dependencies
        run: pip install -e .[dev]
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy awsysco
      - name: pytest (unit + contract, no network)
        run: pytest -q -m "not integration"

  publish:
    runs-on: ubuntu-latest
    needs: test
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(python3 -c "import re; print(re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          if [ "$TAG_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag '$TAG_NAME' does not match package version 'v$PKG_VERSION' — refusing to publish."
            exit 1
          fi
          echo "Tag '$TAG_NAME' matches package version — proceeding."
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
