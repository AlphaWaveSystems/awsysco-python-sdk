[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awsysco"
version = "1.4.0"
description = "Official Python SDK for the AWSYS.CO URL Shortener API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Alpha Wave Systems", email = "dev@awsys.co" },
]
keywords = ["url-shortener", "awsys", "sdk", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio",
  "python-dotenv",
  "pytest-cov",
  "ruff",
  "mypy",
]

[project.urls]
Homepage = "https://awsys.co"
Documentation = "https://docs.awsys.co"
Repository = "https://github.com/AlphaWaveSystems/awsysco-python-sdk"
"Bug Tracker" = "https://github.com/AlphaWaveSystems/awsysco-python-sdk/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires AWSYS_API_KEY and network access to a live/staging AWSYS API (auto-applied to any test using the `client` fixture; see conftest.py)",
]

[tool.coverage.run]
source = ["awsysco"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
